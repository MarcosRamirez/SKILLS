name: on-merge
on:
  push:
    branches: [master]   # the project's default branch
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: on-merge
  cancel-in-progress: false
jobs:
  on-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        # Annotated tags and the status commit both need an author; set it before any git write.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Find the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: bash .github/scripts/tag-release.sh
      - name: Mark closed specs as Implemented
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          PR_BODY="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
          export PR_BODY
          changed="$(bash .github/scripts/close-specs.sh)"
          [ -n "$changed" ] || exit 0
          git add $changed
          git commit -m "docs: mark specs implemented, plans done, roadmap updated (#${PR_NUMBER})"
          git push origin HEAD:${GITHUB_REF_NAME}
