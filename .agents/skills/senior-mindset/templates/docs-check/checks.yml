# Install at .github/workflows/checks.yml
# (and the script next to it at .github/scripts/check-docs.py).
#
# On every pull request: the living documents have no broken relative links and
# link no superseded ADR. To check other files, set DOCS_CHECK_FILES (see the
# header of check-docs.py) in the step's env.
name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check living documents
        run: python3 .github/scripts/check-docs.py
